<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Site - Register</title>
    <link rel="stylesheet" href="register.css">
    <style>
        /* Password strength bar */
        .strength-bar-wrap { height:6px; background:#e0e0e0; border-radius:3px; margin:6px 0 2px; overflow:hidden; }
        .strength-bar { height:100%; width:0; border-radius:3px; transition:width 0.3s, background 0.3s; }
        .strength-label { font-size:12px; font-weight:bold; margin-bottom:6px; min-height:16px; }
        /* Confirm password match indicator */
        .match-hint { font-size:12px; margin-top:4px; min-height:16px; font-weight:bold; }
    </style>
</head>
<body>

    <div class="container"> 
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo_site" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <div class="user-icon-container"> 
                <img src="logo1.jpg" alt="image1" class="user_avatar">
            </div>
            <h1>Create Account</h1>
            <p>Welcome User, join our team!</p>
        </div>

        <main class="login-card">
            <!-- Session banner (shown only when already logged in) -->
            <div id="session-banner" style="display:none; padding:12px 15px; background:#e8f0fe; border:1px solid #004b93; border-radius:6px; margin-bottom:15px; font-size:14px; text-align:center;">
                ✅ You're signed in as <strong id="banner-name"></strong>.
                <a href="dashboard-v2.html" style="color:#004b93; font-weight:bold; margin-left:6px;">Continue to Shop →</a>
                <span style="color:#888; margin:0 6px;">|</span>
                <a href="#" onclick="clearSession()" style="color:#e60000; font-weight:bold;">Sign out</a>
            </div>

            <div id="message-box" style="display:none; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold;"></div>

            <form id="register-form" novalidate>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-fullname" placeholder="Your Name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="email@example.com" required>
                    <div class="match-hint" id="email-hint"></div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="Min. 8 characters" required oninput="updateStrength()">
                    <div class="strength-bar-wrap"><div class="strength-bar" id="strength-bar"></div></div>
                    <div class="strength-label" id="strength-label"></div>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="reg-confirm" placeholder="Re-enter your password" required oninput="checkMatch()">
                    <div class="match-hint" id="match-hint"></div>
                </div>

                <button type="submit" class="sign-in-btn" id="register-btn">Register</button>
                
                <div class="form-footer">
                    <span>Already have an account? <a href="login-v2.html" class="forgot-link">Login here</a></span>
                </div>
            </form>
        </main>
    </div> 

    <script src="register-v2.js"></script>

</body>
</html>
