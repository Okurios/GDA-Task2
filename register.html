<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Site - Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="container"> 
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo_site" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <div class="user-icon-container"> 
                <img src="logo1.jpg" alt="image1" class="user_avatar">
            </div>
            <h1>Create Account</h1>
            <p>Welcome User, join our team!</p>
        </div>

        <main class="login-card">
            <form id="register-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="email@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="********" required>
                </div>

                <button type="submit" class="sign-in-btn">Register</button>
                
                <div class="form-footer">
                    <span>Already have an account? <a href="login.html" class="forgot-link">Login here</a></span>
                </div>
            </form>
        </main>
    </div> 

    <script src="register.js"></script>

</body>
</html>
