<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Sports - Forgot Password</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin:0; padding:0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
               background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
               min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .container { width:100%; max-width:420px; padding:20px; }
        .header { display:flex; justify-content:center; margin-bottom:10px; }
        .basic-logo { width:70px; height:auto; border-radius:50%; }
        .welcome-section { text-align:center; margin-bottom:20px; }
        .welcome-section h1 { color:#fff; font-size:26px; margin:8px 0 4px; }
        .welcome-section p  { color:#aaa; font-size:14px; margin:0; }
        .login-card { background:#fff; border-radius:12px; padding:28px 32px;
                      box-shadow:0 8px 32px rgba(0,0,0,0.4); }
        .input-group { margin-bottom:16px; }
        .input-group label { display:block; font-size:13px; font-weight:bold;
                             color:#333; margin-bottom:5px; }
        .input-group input { width:100%; padding:10px 14px; border:1px solid #ccc;
                             border-radius:6px; font-size:14px; outline:none;
                             transition:border-color 0.2s; }
        .input-group input:focus { border-color:#004b93; box-shadow:0 0 0 2px rgba(0,75,147,0.15); }
        .sign-in-btn { width:100%; padding:12px; background:#004b93; color:#fff; border:none;
                       border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer;
                       margin-top:6px; transition:background 0.2s; }
        .sign-in-btn:hover { background:#003570; }
        .form-footer { margin-top:16px; font-size:13px; color:#555; text-align:center; }
        .forgot-link { color:#004b93; font-weight:bold; text-decoration:none; }
        .forgot-link:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <h1>Forgot Password</h1>
            <p>Enter your email to receive a reset link</p>
        </div>

        <main class="login-card">
            <div id="message-box" style="display:none; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold;"></div>

            <form id="forgot-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reset-email" placeholder="email@example.com" required>
                </div>

                <button type="submit" class="sign-in-btn" id="reset-btn">Send Reset Link</button>

                <div class="form-footer">
                    <span>Remember your password? <a href="login-v2.html" class="forgot-link">Back to Login</a></span>
                </div>
            </form>

        </main>
    </div>

    <script src="forgot-password-v2.js"></script>
</body>
</html>
