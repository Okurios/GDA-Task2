<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Sports - Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin:0; padding:0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
               background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
               min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .container { width:100%; max-width:420px; padding:20px; }
        .header { display:flex; justify-content:center; margin-bottom:10px; }
        .basic-logo { width:70px; height:auto; border-radius:50%; }
        .welcome-section { text-align:center; margin-bottom:20px; }
        .user-icon-container { margin-bottom:12px; }
        .user-avatar { width:100px; height:100px; border-radius:50%; object-fit:cover;
                       border:3px solid #004b93; }
        .welcome-section h1 { color:#fff; font-size:26px; margin:8px 0 4px; }
        .welcome-section p  { color:#aaa; font-size:14px; margin:0; }
        .login-card { background:#fff; border-radius:12px; padding:28px 32px;
                      box-shadow:0 8px 32px rgba(0,0,0,0.4); }
        .input-group { margin-bottom:16px; }
        .input-group label { display:block; font-size:13px; font-weight:bold;
                             color:#333; margin-bottom:5px; }
        .input-group input { width:100%; padding:10px 14px; border:1px solid #ccc;
                             border-radius:6px; font-size:14px; outline:none;
                             transition:border-color 0.2s; }
        .input-group input:focus { border-color:#004b93; box-shadow:0 0 0 2px rgba(0,75,147,0.15); }
        .sign-in-btn { width:100%; padding:12px; background:#004b93; color:#fff; border:none;
                       border-radius:6px; font-size:16px; font-weight:bold; cursor:pointer;
                       margin-top:6px; transition:background 0.2s; }
        .sign-in-btn:hover { background:#003570; }
        .form-footer { margin-top:16px; font-size:13px; color:#555; text-align:center; }
        .forgot-link { color:#004b93; font-weight:bold; text-decoration:none; }
        .forgot-link:hover { text-decoration:underline; }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <div class="user-icon-container"> 
                <img src="logo1.jpg" alt="user" class="user-avatar">
            </div>
            <h1>Welcome Back</h1>
            <p>Please login to your account</p>
        </div>

        <main class="login-card">
            <!-- Session banner (shown only when already logged in) -->
            <div id="session-banner" style="display:none; padding:12px 15px; background:#e8f0fe; border:1px solid #004b93; border-radius:6px; margin-bottom:15px; font-size:14px; text-align:center;">
                ✅ You're signed in as <strong id="banner-name"></strong>.
                <a href="dashboard-v2.html" style="color:#004b93; font-weight:bold; margin-left:6px;">Continue to Shop →</a>
                <span style="color:#888; margin:0 6px;">|</span>
                <a href="#" onclick="clearSession()" style="color:#e60000; font-weight:bold;">Sign out</a>
            </div>

            <div id="message-box" style="display:none; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold;"></div>
            <form id="login-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="email@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="********" required>
                </div>

                <button type="submit" class="sign-in-btn" id="login-btn">Login</button>
                
                <div class="form-footer" style="display:flex;flex-direction:column;gap:8px;text-align:center;">
                    <span><a href="forgot-password-v2.html" class="forgot-link">Forgot Password?</a></span>
                    <span>Don't have an account? <a href="register-v2.html" class="forgot-link">Register here</a></span>
                </div>
            </form>
        </main>
    </div>

    <script src="login-v2.js"></script>
</body>
</html>
