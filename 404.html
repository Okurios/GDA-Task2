<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | GDA Sports</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 480px;
            box-shadow: 0 8px 40px rgba(0,75,147,0.12);
        }
        .logo { width: 70px; margin-bottom: 20px; }
        .code {
            font-size: 96px;
            font-weight: 900;
            color: #004b93;
            line-height: 1;
            letter-spacing: -4px;
        }
        h1 { font-size: 24px; color: #333; margin: 12px 0 8px; }
        p  { color: #888; font-size: 15px; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: #004b93;
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            margin: 6px;
            transition: background 0.2s;
        }
        .btn:hover { background: #003570; }
        .btn.secondary {
            background: transparent;
            color: #004b93;
            border: 2px solid #004b93;
        }
        .btn.secondary:hover { background: #e8f0fe; }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo.png" alt="GDA Sports" class="logo" onerror="this.style.display='none'">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="dashboard-v2.html" class="btn">🏠 Back to Shop</a>
        <a href="javascript:history.back()" class="btn secondary">← Go Back</a>
    </div>
    <script>
        // If token exists, links go to shop; otherwise to login
        if (!localStorage.getItem('gda_token')) {
            document.querySelector('a.btn').href = 'login-v2.html';
            document.querySelector('a.btn').textContent = '🔑 Go to Login';
        }
    </script>
</body>
</html>
