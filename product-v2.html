<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product – GDA Sports</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; margin:0; padding:0; background:#fff; color:#333; }

        /* ── Header ── */
        .header { display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:0 auto; padding:16px 20px; border-bottom:1px solid #eee; }
        .nav-link { color:#004b93; font-weight:bold; text-decoration:none; font-size:14px; }
        .nav-link:hover { text-decoration:underline; }
        .header-right { display:flex; align-items:center; gap:16px; }
        .logout-btn { background:#e60000; color:#fff; border:none; padding:7px 14px; border-radius:4px; cursor:pointer; font-weight:bold; }
        .back-btn { background:transparent; border:2px solid #004b93; color:#004b93; padding:7px 14px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:14px; }
        .back-btn:hover { background:#e8f0fe; }

        /* ── Product layout ── */
        .product-section { max-width:1000px; margin:30px auto; padding:0 20px; display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start; }
        @media(max-width:680px){ .product-section { grid-template-columns:1fr; } }

        .product-image { background:#f4f4f4; border-radius:12px; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .product-image img { max-width:80%; max-height:80%; object-fit:contain; mix-blend-mode:multiply; }

        .product-info {}
        .brand { color:#004b93; font-weight:bold; font-size:15px; margin-bottom:6px; }
        .product-name { font-size:22px; font-weight:700; color:#111; margin-bottom:12px; line-height:1.3; }
        .stars-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
        .stars { color:#f5a623; font-size:18px; }
        .rating-text { font-size:14px; color:#666; }
        .price { font-size:28px; font-weight:900; color:#004b93; margin-bottom:10px; }
        .stock-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:13px; font-weight:bold; margin-bottom:14px; }
        .stock-badge.in-stock { background:#e0ffe0; color:#060; }
        .stock-badge.low-stock { background:#fff3cd; color:#856404; }
        .stock-badge.out-stock { background:#ffe0e0; color:#c00; }

        .size-label { font-weight:bold; font-size:14px; margin-bottom:6px; }
        .size-select { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-bottom:14px; }
        .size-select:focus { border-color:#004b93; outline:none; }

        .btn-row { display:flex; gap:10px; flex-wrap:wrap; }
        .add-btn { flex:1; background:#004b93; color:#fff; border:none; padding:12px; border-radius:6px; font-size:15px; font-weight:bold; cursor:pointer; }
        .add-btn:hover:not(:disabled) { background:#003570; }
        .wish-btn-lg { flex:0; background:transparent; border:2px solid #e60000; color:#e60000; padding:12px 18px; border-radius:6px; font-size:18px; cursor:pointer; }
        .wish-btn-lg.active { background:#ffe0e0; }

        /* ── Reviews ── */
        .reviews-section { max-width:1000px; margin:40px auto 60px; padding:0 20px; }
        .reviews-section h2 { font-size:20px; color:#004b93; border-bottom:2px solid #e8f0fe; padding-bottom:10px; margin-bottom:20px; }

        .review-summary { display:flex; align-items:center; gap:20px; background:#f4f8ff; padding:20px; border-radius:10px; margin-bottom:24px; }
        .big-score { font-size:56px; font-weight:900; color:#004b93; line-height:1; }
        .big-stars { font-size:28px; color:#f5a623; }
        .summary-text { color:#666; font-size:14px; }

        .review-form { background:#f9f9f9; border:1px solid #eee; border-radius:10px; padding:20px; margin-bottom:28px; }
        .review-form h3 { margin:0 0 14px; font-size:16px; }
        .star-picker { display:flex; gap:6px; margin-bottom:12px; font-size:28px; cursor:pointer; }
        .star-picker span { color:#ddd; transition:color 0.15s; }
        .star-picker span.filled, .star-picker span:hover { color:#f5a623; }
        .review-text { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; font-family:inherit; resize:vertical; min-height:80px; }
        .submit-review-btn { background:#004b93; color:#fff; border:none; padding:10px 24px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px; }
        .review-msg { margin-top:8px; font-size:13px; font-weight:bold; }

        .review-card { border-bottom:1px solid #eee; padding:16px 0; }
        .review-card:last-child { border-bottom:none; }
        .reviewer { font-weight:bold; font-size:15px; }
        .review-stars { color:#f5a623; font-size:16px; margin:4px 0; }
        .review-date { font-size:12px; color:#aaa; margin-bottom:6px; }
        .review-comment { font-size:14px; color:#555; }
        .no-reviews { text-align:center; color:#aaa; padding:30px; font-size:16px; }

        /* ── Toast ── */
        #toast-container { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
        .toast { padding:13px 18px; border-radius:8px; font-size:14px; font-weight:bold; color:#fff; min-width:260px; max-width:360px; box-shadow:0 4px 16px rgba(0,0,0,0.18); opacity:0; transform:translateX(40px); animation:slideIn 0.3s forwards; }
        .toast.success { background:#28a745; }
        .toast.error   { background:#e60000; }
        .toast.info    { background:#004b93; }
        .toast.fade-out { animation:fadeOut 0.4s forwards; }
        @keyframes slideIn { to { opacity:1; transform:translateX(0); } }
        @keyframes fadeOut { to { opacity:0; transform:translateX(40px); } }
    </style>
</head>
<body>
<div id="toast-container"></div>

<header class="header">
    <div style="display:flex;align-items:center;gap:12px;">
        <img src="logo.png" alt="GDA" style="width:48px;height:auto;">
        <button class="back-btn" onclick="history.back()">← Back</button>
    </div>
    <div class="header-right">
        <a href="dashboard-v2.html" class="nav-link">🏠 Shop</a>
        <a href="wishlist-v2.html" class="nav-link">❤️ Wishlist</a>
        <a href="cart-v2.html" class="nav-link">🛒 Cart</a>
        <a href="profile-v2.html" class="nav-link">👤 Profile</a>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>
</header>

<div id="product-content">
    <p style="text-align:center;padding:80px;color:#888;">Loading product...</p>
</div>

<script src="product-v2.js"></script>
</body>
</html>
