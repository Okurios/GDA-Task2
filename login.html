<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Site - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <div class="user-icon-container"> 
                <img src="logo1.jpg" alt="user" class="user-avatar">
            </div>
            <h1>Welcome Back</h1>
            <p>Please login to your account</p>
        </div>

        <main class="login-card">
            <form id="login-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="email@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="********" required>
                </div>

                <button type="submit" class="sign-in-btn">Login</button>
                
                <div class="form-footer">
                    <span>Don't have an account? <a href="register.html" class="forgot-link">Register here</a></span>
                </div>
            </form>
        </main>
    </div>

    <script src="login.js"></script>
</body>
</html>
