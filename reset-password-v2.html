<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Sports - Reset Password</title>
    <link rel="stylesheet" href="login.css">
    <style>
        .strength-bar-wrap { height:6px; background:#e0e0e0; border-radius:3px; margin:6px 0 2px; overflow:hidden; }
        .strength-bar { height:100%; width:0; border-radius:3px; transition:width 0.3s,background 0.3s; }
        .strength-label { font-size:12px; font-weight:bold; margin-bottom:6px; min-height:16px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <h1>Set New Password</h1>
            <p>Choose a strong new password</p>
        </div>

        <main class="login-card">
            <div id="message-box" style="display:none; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold;"></div>

            <div id="invalid-token" style="display:none; text-align:center; color:#e60000;">
                <p>⛔ This reset link is invalid or has expired.</p>
                <a href="forgot-password-v2.html" class="forgot-link">Request a new link →</a>
            </div>

            <form id="reset-form" style="display:none">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" placeholder="Min. 8 characters" required oninput="updateStrength()">
                    <div class="strength-bar-wrap"><div class="strength-bar" id="strength-bar"></div></div>
                    <div class="strength-label" id="strength-label"></div>
                </div>

                <button type="submit" class="sign-in-btn" id="save-btn">Save New Password</button>

                <div class="form-footer">
                    <span><a href="login-v2.html" class="forgot-link">Back to Login</a></span>
                </div>
            </form>
        </main>
    </div>

    <script src="reset-password-v2.js"></script>
</body>
</html>
