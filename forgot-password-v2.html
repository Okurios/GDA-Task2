<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDA Sports - Forgot Password</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="gda-logo1">
                <img src="logo.png" alt="logo" class="basic-logo">
            </div>
        </header>

        <div class="welcome-section">
            <h1>Forgot Password</h1>
            <p>Enter your email to receive a reset link</p>
        </div>

        <main class="login-card">
            <div id="message-box" style="display:none; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center; font-weight:bold;"></div>

            <form id="forgot-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reset-email" placeholder="email@example.com" required>
                </div>

                <button type="submit" class="sign-in-btn" id="reset-btn">Send Reset Link</button>

                <div class="form-footer">
                    <span>Remember your password? <a href="login-v2.html" class="forgot-link">Back to Login</a></span>
                </div>
            </form>

        </main>
    </div>

    <script src="forgot-password-v2.js"></script>
</body>
</html>
